<head>

    <style>
        body {
            margin: 0;
            background-color: rgb(255, 229, 182);
        }

        header {
            background-color: rgb(255, 166, 0);
            border-bottom: 6px solid #592d0c;
            width: 100%;
        }

        header h1 {
            font-size: 36px;
            font-weight: bold;
            color: #291707;
        }

        .headerContainer {
            width: 80%;
            max-width: 1400px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        div > nav {
            display: flex;
            align-items: center;
            padding: 10px;
        }

        div > nav > a {
            font-family: sans-serif;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            color: #291707;
            padding: 20px 22px;
            border-radius: 12px;
        }

        div > nav > a:hover {
            background-color: #39200c;
            color: #f2b82f;
        }

        .active {
            background-color: #39200c;
            color: #f2b82f;
        }

        div.container {
            background-color: orange;
        }

        div.inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            border: solid black 3px;
            width: 90%;
            margin: auto;
            padding: 30px;
            background-color: #ffaf37;
            box-shadow: 3px 3px 10px black;
        }



        .photos {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 60%;
            margin: auto;
        }

        img {
            width: 32%;
            height: auto;
            border: solid white 6px;
            border-radius: 15px;
            box-shadow: 3px 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .info {
            text-align: center;
            width: 70%;
            font-size: 22px;
            margin: auto;
            border: solid white 6px;
            border-radius: 15px;
            box-shadow: 3px 5px 15px rgba(0, 0, 0, 0.3);
            background-color: rgb(255, 191, 72);
            display: flex;
            align-items: center; 
            gap: 250px;
            justify-content: center;
        }

        section > h1 {
            text-align: center;
            text-decoration: underline;
            text-shadow: 0px 0px 5px rgba(0, 0, 0, 0.25);
            background-color: rgb(255, 249, 237);
            margin: auto;
            border-radius: 200px;
            padding: 45px;
            width: fit-content;
            box-shadow: 3px 5px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin: auto;
            width: fit-content;
            background-color: rgb(255, 136, 0);
            padding: 10px;
            padding-right: 50px;
            padding-left: 50px;
            border-radius: 100px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
        }

        p {
            margin: auto;
            text-decoration: underline;
            text-shadow: 0px 0px 20px rgba(0, 0, 0, 0.25);
            padding-top: 10px;
        }

        footer {
            background-color: rgb(255, 115, 0);
            color: rgb(58, 38, 0);
            width: 100%;
            margin: 0;
            padding-bottom: 50px;
            padding-top: 20px;
            border-top: 6px solid #592d0c;
            text-align: center;
        }
        
        footer > h3 {
            font-size: x-large;
        }

        footer > nav {
            text-align: center;
        }

        footer > nav > a {
            font-family: sans-serif;
            font-size: medium;
            text-decoration: underline;
            color: #291707;
            padding-left: 10px;
            padding-right: 10px;
            border-radius: 12px;
        }

    </style>
</head>
<body>
    <header>
        <div class="headerContainer">
            <h1>The Real Ozone Rangers</h1>
            <nav>

                <a href="performances.html">Gallery</a>
                <a class="active" href="contact.html">Contacts</a>

    <div class="container">

        <br>

            <img src="images/Peter.jpeg" alt="Peter">
        </div>
        <br>
        <br>
        <br>
        <br>
    </div>

    <section>
        <br>
        <br>
        <h1>Contact Us For Bookings Here!</h1>
        <br>
        <br>
    </section>
    

    <div class="info">
        
        <div class="infoInner">
            <br>
            <br>

    <br>
    <br>

    <footer>
        <h3>The Real Ozone Rangers</h3>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About / Our Story</a>
            <a href="performances.html">Performances / Gallery</a>
            <a href="contact.html">Contacts / Booking</a>
        </nav>
    </footer>
</body>
</html>
