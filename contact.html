    <style>
        body {
            margin: 0;
            background-color: rgb(255, 229, 182);
        }

        header {
            background-color: rgb(255, 166, 0);
            border-bottom: 6px solid #592d0c;
            width: 100%;
        }

        header h1 {
            font-size: 36px;
            font-weight: bold;
            color: #291707;
        }

        .headerContainer {
            width: 80%;
            max-width: 1400px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav {
            display: flex;
            align-items: center;
            padding: 10px;
        }

        nav > a {
            font-family: sans-serif;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            color: #291707;
            padding: 20px 22px;
            border-radius: 12px;
        }

        nav a:hover {
            background-color: #39200c;
            color: #f2b82f;
        }

        .active {
            background-color: #39200c;
            color: #f2b82f;
        }

        div.container {
            background-color: orange;
        }

        div.inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            border: solid black 3px;
            width: 90%;
            margin: auto;
            padding: 30px;
            background-color: #ffaf37;
            box-shadow: 3px 3px 10px black;
        }

        .photos {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 60%;
            margin: auto;
        }

        img {
            width: 32%;
            height: auto;
            border: solid white 6px;
            border-radius: 15px;
            box-shadow: 3px 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .info {
            text-align: center;
            width: 70%;
            font-size: 22px;
            margin: auto;
            border: solid white 6px;
            border-radius: 15px;
            box-shadow: 3px 5px 15px rgba(0, 0, 0, 0.3);
            background-color: rgb(255, 191, 72);
        }

        section > h1 {
            text-align: center;
            text-decoration: underline;
        }

        p {
            margin: 35px 0;
        }

        footer {
            background-color: rgb(255, 115, 0);
            color: rgb(58, 38, 0);
            width: 100%;
            margin: 0;
            padding: 10px 0px;
            border-top: 6px solid #592d0c;
            text-align: center;
        }

        footer > nav {

        }
    </style>
</head>
<body>
    <header>
        <div class="headerContainer">
            <h1>The Real Ozone Rangers</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">Our Story</a>
                <a href="performances.html">Gallery</a>
                <a class="active" href="contact.html">Contacts</a>
            </nav>
        </div>
    </header>
    
    <div class="container">
        <br>
        <br>
        <br>
        <div class="photos">
            <img src="images/Terry.jpeg" alt="Terry">
            <img src="images/Steve-Cook.jpeg" alt="Dave"> 
            <img src="images/Peter.jpeg" alt="Peter">
        </div>
        <br>
        <br>
        <br>
    </div>

    <section>
        <br>
        <br>
        <h1>Contact Us For Bookings Here!</h1>
        <br>
        <br>
    </section>
    

    <div class="info">
        <h2>Phone Number</h2>
        <p>
            (xxx) xxx-xxxx
        </p>

        <h2>Email</h2>
        <p>
            xxx@gmail.com
        </p>

        <h2>Location</h2>
        <p>
            Johnson City, TN 
        </p>
    </div>

    <br>
    <br>
    <br>
    
    
    <footer>
        <h3>The Real Ozone Rangers</h3>
    </footer>
</body>
